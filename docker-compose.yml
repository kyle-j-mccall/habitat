services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: habitat
      POSTGRES_USER: habitat
      POSTGRES_PASSWORD: habitat_dev
    ports:
      - '5432:5432'
    volumes:
      - habitat_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U habitat -d habitat']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  habitat_postgres_data:

